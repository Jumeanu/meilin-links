const W=200,H=210,cv=document.getElementById('px'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;

const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const vig=mk();{const x=vig.getContext('2d'),d=x.createImageData(W,H),B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
 for(let y=0;y<H;y++)for(let X=0;X<W;X++){const dx=(X-W/2)/(W*.7),dy=(y-H*.46)/(H*.7),r=Math.hypot(dx,dy);let a=Math.max(0,Math.min(1,(r-.55)/.45))*.8;
  a=Math.floor(a*5+B[(y%4)*4+X%4]/16)/5;const o=(y*W+X)*4;d.data[o+3]=a*255;}x.putImageData(d,0,0);}
// spotlight on the couple: soft dithered dimming everywhere else + a faint warm beam
const dark=mk();{const x=dark.getContext('2d'),d=x.createImageData(W,H),B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
 for(let y=0;y<H;y++)for(let X=0;X<W;X++){const r=Math.hypot((X-107)/40,(y-145)/34);let a=Math.max(0,Math.min(1,(r-.5)/.8))*.3;
  a=Math.floor(a*16+B[(y%4)*4+X%4]/16)/16;const o=(y*W+X)*4;d.data[o]=6;d.data[o+1]=8;d.data[o+2]=12;d.data[o+3]=a*255;}x.putImageData(d,0,0);}
const beam=mk();{const x=beam.getContext('2d'),d=x.createImageData(W,H),B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
 for(let y=17;y<170;y++){const t=(y-17)/146,hw=4+t*24;for(let X=Math.floor(107-hw)-1;X<107+hw+2;X++){const e=Math.abs(X-107)/hw;if(e>=1)continue;
  let a=Math.pow(1-e,1.5)*.2*(.4+.6*t);a=Math.floor(a*12+B[(y%4)*4+X%4]/16)/12;const o=(y*W+X)*4;d.data[o]=255;d.data[o+1]=220;d.data[o+2]=160;d.data[o+3]=a*255;}}x.putImageData(d,0,0);}

const NC=['#ffd27a','#ff9cc8','#7fe3d3'];
const drawNote=(i,x,y,a)=>{if(a<=0)return;g.globalAlpha=Math.ceil(a*3)/3;g.fillStyle=NC[i%3];NOTE[i%2].forEach((r,yy)=>[...r].forEach((ch,xx)=>{if(ch==='#')g.fillRect(x+xx,y+yy,1,1)}));g.globalAlpha=1;};

};
const tick=now=>{const dt=Math.min(now-last,250);last=now;
  if(!paused){T+=dt;if(solo&&(soloLeft-=dt)<=0)goDuo();
    st.forEach(p=>{if(!live(p))return;const a=cur(p);p.t+=dt;while(p.t>=a.d[p.f]){p.t-=a.d[p.f];p.f++;if(p.f>=a.n){p.f=0;if(++p.loop>=p.c.seq[p.s][1]){setAct(p,p.s+1);if(p.c.duo&&p.s===0)goSolo();break;}}}});}

Promise.all([...Object.values(BG),FG,...Object.values(SP).map(a=>a.im)].map(im=>im.decode().catch(()=>{}))).then(()=>{draw();requestAnimationFrame(tick)});

  if(p.c.solo){if(!solo)goSolo();else soloLeft=SOLO_MS;setAct(p,p.s+1);}
  else if(p.c.duo){if(solo)goDuo();else setAct(p,p.s+1);}
  else setAct(p,p.s+1);if(paused)draw();};
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(b)next(+b.dataset.i)});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  for(let i=st.length-1;i>=0;i--){const p=st[i],a=cur(p),[px,py]=p.c.pos;if(!live(p))continue;if(x>=px+6&&x<px+a.w-6&&y>=py+4&&y<py+p.c.clip){next(i);return;}}});
const pp=document.getElementById('pp');
const IC={pause:'<svg viewBox="0 0 8 8" aria-hidden="true"><path fill="currentColor" d="M2 1h1.5v6H2zM4.5 1H6v6H4.5z"/></svg>',

}

<script>
/* MEILIN lounge music — three original songs synthesised live with Web Audio (no audio files). */
const MUS=(()=>{
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const hz=n=>{const m=/^([A-G])(#|b)?(-?\d)$/.exec(n);const s=SEMI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,((+m[3]+1)*12+s-69)/12);};
// "E5:.5 r:1 | ..." -> [[beat,freq,dur]]
const line=(str,at=0)=>{let b=at;const o=[];str.replace(/\|/g,' ').trim().split(/\s+/).forEach(tk=>{const[n,d]=tk.split(':');if(n!=='r')o.push([b,hz(n),+d]);b+=+d;});return o;};

/* ---------- songs ---------- */
function song1(){ // 霓虹夜 Neon Night — slow smoky ballad, muted horn over Rhodes
  const V={Am9:['G3 B3 C4 E4','A2','E2'],Dm9:['F3 A3 C4 E4','D2','A2'],G13:['F3 A3 B3 E4','G2','D2'],Cmaj9:['E3 G3 B3 D4','C2','G2'],
    Fmaj7:['A3 C4 E4 G4','F2','C3'],Bm7b5:['A3 D4 F4','B2','F2'],E7b9:['G#3 D4 F4','E2','B2'],F7:['A3 C4 Eb4','F2','C3']};
  const C=[['Am9'],['Dm9'],['G13'],['Cmaj9'],['Fmaj7'],['Bm7b5','E7b9'],['Am9'],['Am9'],['Am9'],['Dm9'],['G13'],['Cmaj9'],['Fmaj7'],['Bm7b5','E7b9'],['Am9','F7'],['E7b9']];
  const ev=[];const A=(t,v,f,d,g)=>ev.push({t,v,f,d,g});
  C.forEach((cs,i)=>{const b=i*4,len=4/cs.length;cs.forEach((c,j)=>{const[vo,r,f]=V[c],t=b+j*len;
    vo.split(' ').forEach(n=>A(t,'rhodes',hz(n),len-.05,.075));
    if(len===4){A(t,'bass',hz(r),1.9,.34);A(t+2,'bass',hz(f),1.9,.3);}else A(t,'bass',hz(r),1.9,.34);});
    for(let k=0;k<4;k++){A(b+k,'brush',0,.3,k%2?.11:.07);A(b+k,'ride',0,.5,k%2?.03:.04);}
    A(b+1.5,'ride',0,.3,.02);A(b+3.5,'ride',0,.3,.02);A(b+1,'rim',0,.1,.05);A(b+3,'rim',0,.1,.05);A(b,'kick',0,.3,.22);});
  line(`r:1 E5:.5 G5:.5 A5:1.5 G5:.5 | E5:1 D5:.5 C5:.5 D5:2 | r:.5 B4:.5 D5:.5 E5:.5 G5:1 F5:1 | E5:3 r:1 |
        r:.5 A4:.5 C5:.5 E5:.5 A5:1 G5:1 | F5:1 E5:1 D5:1 G#4:1 | B4:.5 C5:.5 A4:3 | r:4 |
        r:1 E5:.5 G5:.5 A5:1 C6:1 | B5:.5 A5:.5 G5:.5 E5:.5 D5:2 | r:.5 D5:.5 E5:.5 G5:.5 B5:1 A5:1 | G5:1.5 E5:.5 D5:2 |
        C5:.5 D5:.5 E5:.5 G5:.5 A5:2 | G5:1 F5:1 E5:1 D5:.5 B4:.5 | C5:1 B4:.5 A4:2.5 | r:4`).forEach(([t,f,d])=>A(t,'horn',f,d,.2));
  line('A5:.5 G5:.5 E5:.5 D5:.5 C5:.5 A4:.5 G4:1',29).forEach(([t,f,d])=>A(t,'piano',f,d,.16));
  line('F5:.5 E5:.5 D5:.5 B4:.5 G#4:.5 F4:.5 E4:1',61).forEach(([t,f,d])=>A(t,'piano',f,d,.16));
  return {bpm:66,swing:.64,beats:64,ev};
}

function song3(){ // 今晚 Tonight — slow lo-fi bossa, Rhodes + plucked melody, vinyl crackle
  const V={Dm9:['F3 A3 C4 E4','D2','A2'],G13:['F3 A3 B3 E4','G2','D2'],Cmaj9:['E3 G3 B3 D4','C2','G2'],A7b13:['G3 C#4 F4','A2','E2'],

const SONGS=[song1(),song2(),song3()];
SONGS.forEach(s=>{s.loops=Math.ceil(90/(s.beats*60/s.bpm));s.ev.forEach(e=>{const fl=Math.floor(e.t),fr=e.t-fl;if(s.swing&&Math.abs(fr-.5)<1e-6)e.t=fl+s.swing;});s.ev.sort((a,b)=>a.t-b.t);});

/* ---------- audio graph ---------- */
let ctx,master,rev,noise,crk,bus,timer,idx=0,loopT=0,cur=-1,on=false,vol=.5,loops=0;
function impulse(sec,decay){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
function setup(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;comp.connect(ctx.destination);
  const tone=ctx.createBiquadFilter();tone.type='lowpass';tone.frequency.value=7000;tone.connect(comp);
  master=ctx.createGain();master.gain.value=0;master.connect(tone);
  rev=ctx.createConvolver();rev.buffer=impulse(2.6,2.8);const rg=ctx.createGain();rg.gain.value=.5;rev.connect(rg);rg.connect(master);
  noise=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  crk=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate);const cd=crk.getChannelData(0);
  for(let i=0;i<cd.length;i++)cd[i]=(Math.random()*2-1)*.012+(Math.random()<.0006?(Math.random()*2-1)*.7:0);
}
const mkBus=()=>{const d=ctx.createGain(),s=ctx.createGain();d.connect(master);s.connect(rev);return{d,s,nodes:[]};};
function out(node,send){node.connect(bus.d);if(send){const g=ctx.createGain();g.gain.value=send;node.connect(g);g.connect(bus.s);}}
function osc(type,f,t,end){const o=ctx.createOscillator();o.type=type;o.frequency.value=f;o.start(t);o.stop(end);return o;}
function nz(t,end){const s=ctx.createBufferSource();s.buffer=noise;s.start(t,Math.random()*1.5);s.stop(end);return s;}
function gain(v){const g=ctx.createGain();g.gain.value=v;return g;}
function filt(type,f,q=1){const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;}
function perc(src,t,peak,tc,chain){const g=gain(0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.003);g.gain.setTargetAtTime(0,t+.003,tc);let n=src;chain.forEach(c=>{n.connect(c);n=c;});n.connect(g);return g;}
const V={
  piano(t,f,d,g){const end=t+d+2,e=gain(0);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.004);e.gain.setTargetAtTime(g*.35,t+.004,.25);e.gain.setTargetAtTime(0,t+d,.18);
    const lp=filt('lowpass',3200);osc('triangle',f,t,end).connect(lp);const h=gain(.25);osc('sine',f*2,t,end).connect(h);h.connect(lp);lp.connect(e);out(e,.3);},
  rhodes(t,f,d,g){const end=t+d+2,c=osc('sine',f,t,end),m=osc('sine',f,t,end),mi=gain(f*1.1);mi.gain.setTargetAtTime(f*.15,t,.25);m.connect(mi);mi.connect(c.frequency);
    const e=gain(0);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.01);e.gain.setTargetAtTime(g*.55,t+.01,.6);e.gain.setTargetAtTime(0,t+d,.3);c.connect(e);out(e,.35);},
  bass(t,f,d,g){const end=t+d+1,lp=filt('lowpass',650,1.2),e=gain(0);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.012);e.gain.setTargetAtTime(g*.45,t+.012,.22);e.gain.setTargetAtTime(0,t+d,.05);
    osc('triangle',f,t,end).connect(lp);const s=gain(.6);osc('sine',f,t,end).connect(s);s.connect(lp);lp.connect(e);out(e,.06);},
  horn(t,f,d,g){const end=t+d+.6,o=osc('sawtooth',f,t,end);o.frequency.setValueAtTime(f*.985,t);o.frequency.linearRampToValueAtTime(f,t+.07);
    const l=osc('sine',5.2,t,end),lg=gain(0);lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.007,t+Math.min(d,.5));l.connect(lg);lg.connect(o.frequency);
    const bp=filt('bandpass',1300,1.1),lp=filt('lowpass',3000),e=gain(0);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.07);e.gain.setTargetAtTime(g*.8,t+.07,.3);e.gain.setTargetAtTime(0,t+d-.03,.07);
    o.connect(bp);bp.connect(lp);lp.connect(e);out(e,.4);},
  clar(t,f,d,g){const end=t+d+.6,o=osc('square',f,t,end),l=osc('sine',5.6,t,end),lg=gain(0);lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.006,t+Math.min(d,.4));l.connect(lg);lg.connect(o.frequency);
    const lp=filt('lowpass',1700,.8),e=gain(0);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g*.55,t+.04);e.gain.setTargetAtTime(g*.45,t+.04,.3);e.gain.setTargetAtTime(0,t+d-.03,.05);
    o.connect(lp);lp.connect(e);out(e,.35);},
  pluck(t,f,d,g){const end=t+Math.max(d,.3)+1.2,lp=filt('lowpass',4200);lp.frequency.setTargetAtTime(1300,t,.12);const e=gain(0);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.002);e.gain.setTargetAtTime(0,t+.002,.32);
    osc('triangle',f,t,end).connect(lp);const h=gain(.35);osc('sine',f*2,t,end).connect(h);h.connect(lp);const h3=gain(.12);osc('sine',f*3,t,end).connect(h3);h3.connect(lp);lp.connect(e);out(e,.5);},
  brush(t,f,d,g){const end=t+.5,e=gain(0);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.02);e.gain.setTargetAtTime(0,t+.02,.07);const s=nz(t,end),bp=filt('bandpass',3200,.7);s.connect(bp);bp.connect(e);out(e,.2);},
  ride(t,f,d,g){const end=t+1.2;out(perc(nz(t,end),t,g,.22,[filt('highpass',5500),filt('peaking',8000,2)]),.25);const p=gain(g*.12);osc('sine',5230,t,end).connect(p);out(perc(p,t,1,.25,[]),.2);},
  hat(t,f,d,g){out(perc(nz(t,t+.2),t,g,.025,[filt('highpass',7500)]),.1);},
  shaker(t,f,d,g){out(perc(nz(t,t+.2),t,g,.03,[filt('bandpass',6500,1.6)]),.15);},
  rim(t,f,d,g){const o=osc('sine',1750,t,t+.15);out(perc(o,t,g*.6,.012,[]),.3);out(perc(nz(t,t+.15),t,g*.5,.015,[filt('bandpass',2600,2)]),.3);},
  kick(t,f,d,g){const o=osc('sine',110,t,t+.5);o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(46,t+.12);out(perc(o,t,g,.11,[]),0);},
};
function pump(){const s=SONGS[cur],spb=60/s.bpm,ahead=ctx.currentTime+.3;
  for(;;){const e=s.ev[idx],t=loopT+e.t*spb;if(t>ahead)break;if(t>ctx.currentTime-.05)V[e.v](t,e.f,e.d*spb,e.g);
    if(++idx>=s.ev.length){idx=0;loopT+=s.beats*spb;
      if(api.list&&++loops>=s.loops){loops=0;loopT+=1.2;cur=(cur+1)%SONGS.length;crack(loopT);return pump();}}}}
function crack(t){if(!bus)return;if(bus.crk&&!SONGS[cur].crackle){try{bus.crk.stop(t)}catch(e){}bus.crk=null;}
  if(SONGS[cur].crackle&&!bus.crk){const c=ctx.createBufferSource();c.buffer=crk;c.loop=true;const g=gain(.5),lp=filt('lowpass',5000);c.connect(lp);lp.connect(g);g.connect(bus.d);c.start(t);bus.crk=c;bus.nodes.push(c);}}
function start(i){
  if(bus){const old=bus;old.d.gain.setTargetAtTime(0,ctx.currentTime,.15);old.s.gain.setTargetAtTime(0,ctx.currentTime,.15);setTimeout(()=>{old.d.disconnect();old.s.disconnect();old.nodes.forEach(n=>{try{n.stop()}catch(e){}});},1200);}
  cur=i;bus=mkBus();idx=0;loops=0;loopT=ctx.currentTime+.12;crack(loopT);
  clearInterval(timer);timer=setInterval(pump,40);pump();
}
const api={
  list:false,count:SONGS.length,get on(){return on},get song(){return cur},
  play(i=cur<0?0:cur){if(!ctx)setup();ctx.resume();if(!on||i!==cur)start(i);on=true;master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(vol,ctx.currentTime,.25);},
  stop(){if(!ctx||!on)return;on=false;master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(0,ctx.currentTime,.12);
    setTimeout(()=>{if(on)return;clearInterval(timer);if(bus){bus.nodes.forEach(n=>{try{n.stop()}catch(e){}});bus.d.disconnect();bus.s.disconnect();bus=null;}ctx.suspend();},600);},
};
document.addEventListener('visibilitychange',()=>{if(!ctx||!on)return;if(document.hidden){clearInterval(timer);ctx.suspend();}else{ctx.resume().then(()=>{start(cur);});}});
return api;
})();

<script>
{const b=document.getElementById('snd');MUS.list=true;
let want=(()=>{try{return localStorage.getItem('snd')!=='0'}catch(e){return true}})();
const save=()=>{try{localStorage.setItem('snd',want?'1':'0')}catch(e){}};
const show=()=>{b.setAttribute('aria-pressed',want);b.title=tr('music')+(want?' ✓':'');};
const go=()=>{try{MUS.play()}catch(e){}};
// browsers only allow sound after the visitor's first tap, so the music waits for it
const first=e=>{if(e.target.closest&&e.target.closest('#snd'))return;off();if(want)go();};
const off=()=>['pointerdown','keydown'].forEach(t=>removeEventListener(t,first,true));
['pointerdown','keydown'].forEach(t=>addEventListener(t,first,true));
b.addEventListener('click',()=>{off();if(want&&!MUS.on){go();}else{want=!want;want?go():MUS.stop();}save();show();});
show();onLang.push(show);}
</script>
